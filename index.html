<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestión de Financiamiento de Vehículos a Crédito</title>

  <!-- Hoja de estilos CSS Mobile-First -->
  <link rel="stylesheet" href="styles.css">

  <!-- React 18 & ReactDOM UMD desde cdnjs (CDN de Máxima Velocidad Global) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Contenedor Principal donde se Renderiza la App -->
  <div id="root"></div>

  <!-- Aplicación React Principal (Carga Instantánea) -->
  <script src="app.js"></script>

  <!-- Lucide Icons & HTML2PDF (Carga Secundaria) -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>

  <!-- SDKs de Firebase Nube (Carga Secundaria en Segundo Plano) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="cloudDbService.js"></script>
</body>
</html>
